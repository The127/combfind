[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "combfind"
version = "0.1.12"
description = "Queryable concept map of a codebase for LLM coding agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ email = "karolinkostial@gmail.com" }]
keywords = ["llm", "code-search", "embeddings", "tree-sitter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "click>=8.1",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
    "tree-sitter>=0.22",
    "tree-sitter-go>=0.23",
    "tree-sitter-python>=0.23",
]

[project.optional-dependencies]
# pip install "combfind[llm]" --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
llm = ["llama-cpp-python>=0.2", "huggingface_hub>=0.20"]
openai = ["openai>=1.0"]
hdbscan = ["hdbscan>=0.8"]
scip = ["protobuf>=5.0"]
output = ["rich>=13.0", "tqdm>=4.66"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
combfind = "combfind.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["combfind*"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
